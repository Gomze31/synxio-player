# jdk.net.unixdomain.tmpdir : sur cette machine, le dossier TEMP de l'utilisateur
# refuse les sockets AF_UNIX, or le JDK 17+ s'en sert pour le pipe interne de
# Selector.open(). Sans cette redirection, Gradle échoue avec
# « Unable to establish loopback connection ». Adapte le chemin si tu changes de poste.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:\\Users\\y.gomez\\android-dev\\tmp
kotlin.daemon.jvmargs=-Xmx2048m -Djdk.net.unixdomain.tmpdir=C:\\Users\\y.gomez\\android-dev\\tmp
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# Sort les dossiers `build/` de OneDrive (voir build.gradle.kts). Commente cette ligne
# si tu déplaces le projet hors d'un dossier synchronisé.
buildDirRoot=C:/Users/y.gomez/android-dev/build

# Hilt: KSP-only, pas d'aggregating task Java
