name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle signe toujours avec l'ancienne clé (app/synxio-release.keystore) : c'est la
      # première de la lignée. L'étape suivante re-signe avec la lignée ancienne → nouvelle.
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --configuration-cache -x lintVitalRelease

      - name: Sign with rotated key (APK Signature Scheme v3 lineage)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LINEAGE_BASE64: ${{ secrets.LINEAGE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$LINEAGE_BASE64" ]; then
            echo "::warning title=Clé de release publique::Secrets de rotation absents : l'APK reste signé avec la clé de secours app/synxio-release.keystore, dont le mot de passe est public. Voir docs/KEY_ROTATION.md."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$LINEAGE_BASE64" ]; then
            # La nouvelle clé sans lignée casserait toutes les mises à jour : on s'arrête.
            echo "::error title=Rotation incomplète::KEYSTORE_BASE64 et LINEAGE_BASE64 doivent être définis ensemble."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-2.jks"
          echo "$LINEAGE_BASE64" | base64 -d > "$RUNNER_TEMP/synxio.lineage"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$BT/apksigner" sign \
              --ks app/synxio-release.keystore --ks-key-alias synxio --ks-pass pass:synxioplayer \
              --next-signer \
              --ks "$RUNNER_TEMP/release-2.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --lineage "$RUNNER_TEMP/synxio.lineage" \
              --min-sdk-version 26 --rotation-min-sdk-version 28 \
              "$apk"
            "$BT/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|Signer|SHA-256"
          done
          rm -f "$RUNNER_TEMP/release-2.jks" "$RUNNER_TEMP/synxio.lineage"

      - name: Determine Release Tag
        id: tag
        run: |
          echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            for f in app/build/outputs/apk/release/*.apk; do
              cp "$f" "release-artifacts/synxio-player-${{ steps.tag.outputs.tag_name }}.apk"
            done
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Synxio Player ${{ steps.tag.outputs.tag_name }}
          files: release-artifacts/*.apk
          generate_release_notes: true
