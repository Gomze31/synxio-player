name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle signe avec la clé privée (v1 + v2 + v3). apksigner rejoue ensuite la
      # signature avec la lignée ancienne → nouvelle, pour que les installations encore
      # signées par l'ancienne clé acceptent la mise à jour (Android 9+).
      - name: Check release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LINEAGE_BASE64: ${{ secrets.LINEAGE_BASE64 }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD LINEAGE_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Secrets de release absents::Manquent :$missing. Voir docs/KEY_ROTATION.md §4. Aucune release n'est signée sans la clé privée."
            exit 1
          fi

      - name: Materialize signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LINEAGE_BASE64: ${{ secrets.LINEAGE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-2.jks"
          echo "$LINEAGE_BASE64" | base64 -d > "$RUNNER_TEMP/synxio.lineage"
          {
            echo "storeFile=$RUNNER_TEMP/release-2.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --configuration-cache -x lintVitalRelease

      - name: Apply signing lineage (APK Signature Scheme v3)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release-2.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --lineage "$RUNNER_TEMP/synxio.lineage" \
              --min-sdk-version 28 --rotation-min-sdk-version 28 \
              "$apk"
            "$BT/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|Signer|SHA-256"
          done

      - name: Scrub signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-2.jks" "$RUNNER_TEMP/synxio.lineage" keystore.properties

      - name: Determine Release Tag
        id: tag
        run: |
          echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            for f in app/build/outputs/apk/release/*.apk; do
              cp "$f" "release-artifacts/synxio-player-${{ steps.tag.outputs.tag_name }}.apk"
            done
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Synxio Player ${{ steps.tag.outputs.tag_name }}
          files: release-artifacts/*.apk
          generate_release_notes: true
