name: Build and Release on Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            cat <<EOF > keystore.properties
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "Keystore secret not present, skipping signature."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Determine Release Tag
        id: tag
        run: |
          echo "tag_name=build-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            for f in app/build/outputs/apk/release/*.apk; do
              cp "$f" "release-artifacts/synxio-player-${{ steps.tag.outputs.tag_name }}.apk"
            done
          fi

      - name: Publish Release to this repository
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Synxio Player ${{ steps.tag.outputs.tag_name }}
          files: release-artifacts/*.apk
          generate_release_notes: true
